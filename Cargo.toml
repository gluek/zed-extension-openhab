[package]
name = "openhab"
# extension.toml is the authoritative published version — keep in sync with it.
version = "0.6.8"
edition = "2021"
publish = false
license = "MIT"

[lib]
path = "src/openhab.rs"
crate-type = ["cdylib"]

# Shrink the shipped extension.wasm.
[profile.release]
lto = true
opt-level = "z"
strip = true

[dependencies]
serde_json = "1.0"
zed_extension_api = "0.7.0"
