name = "openHAB"
grammar = "openhab"         # Phase B purpose-built grammar (grammar/); Phase A used "java"
# Same file associations as the VS Code extension (package.json contributes.languages)
path_suffixes = ["rules", "script", "items", "sitemap", "things", "persist"]
line_comments = ["// "]
tab_size = 4

# Item / thing / channel names use underscores; allow completion to continue
# mid-identifier (e.g. while typing `Kitchen_Li`).
word_characters = ["_", "$"]

autoclose_before = ";:.,=}])>"

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "(", end = ")", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]

# `else` / `else if` must line up with their `if`, not drift one level in.
# This is Zed's documented clause-alignment mechanism; it relies on the
# `@start.if` marker in indents.scm. Line patterns are language-wide, so only
# ones that are valid Java *and* never DSL content are listed here.
decrease_indent_patterns = [
    { pattern = "\\s*else\\b", valid_after = ["if"] },
]

[overrides.string]
completion_query_characters = ["_", "$"]
