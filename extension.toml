id = "openhab"
name = "openHAB"
version = "0.6.6"
schema_version = 1
authors = ["Gerrit Lükens"]
description = "openHAB textual configuration support: syntax highlighting, hover, completion, navigation, and diagnostics."
repository = "https://github.com/gluek/zed-extension-openhab"

# Purpose-built tree-sitter-openhab grammar (fork of tree-sitter-java with
# openHAB DSL productions). The key MUST match the grammar repository's
# exported C symbol: Zed compiles with `-Wl,--export=tree_sitter_<key>`, and
# the grammar's parser.c defines `tree_sitter_openhab`.
[grammars.openhab]
repository = "https://github.com/gluek/tree-sitter-openhab"
rev = "a7121b755c3b9413ec952f0c84e46ed3b3c0e597"

[language_servers.openhab-lsp]
name = "openHAB Language Server"
languages = ["openHAB"]

[language_servers.openhab-lsp.language_ids]
openHAB = "openhab"
