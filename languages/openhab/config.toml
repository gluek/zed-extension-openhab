name = "openHAB"
grammar = "java"
# Same file associations as the VS Code extension (package.json contributes.languages)
path_suffixes = ["rules", "script", "items", "sitemap", "things", "persist"]
line_comments = ["// "]
tab_size = 4

# Item / thing / channel names use underscores; allow completion to continue
# mid-identifier (e.g. while typing `Kitchen_Li`).
word_characters = ["_", "$"]

autoclose_before = ";:.,=}])>"

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "(", end = ")", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]

[overrides.string]
completion_query_characters = ["_", "$"]
